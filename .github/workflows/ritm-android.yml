name: Ритм — Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/ritm-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Тесты ядра и сборка APK
        run: ./gradlew :core:test :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ritm-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: android/core/build/reports/tests/
          if-no-files-found: ignore

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ritm-apk
          path: apk
      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Эмулятор Android 12 — экраны, кнопка, падения
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
